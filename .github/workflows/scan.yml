name: Dependency & Image Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan even if nothing changes, so newly-disclosed CVEs
    # against unchanged dependencies still get caught.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab

jobs:
  npm-audit:
    name: npm audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # audit-level=high means this step (and the job) fails the build
      # when high/critical vulnerabilities are present — this repo's
      # pinned lodash/minimist versions are intentionally vulnerable,
      # so expect this job to fail until they're bumped.
      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Generate JSON report (always, even on failure)
        if: always()
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  trivy-fs:
    name: Trivy filesystem scan (lockfile CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-fs"

  trivy-image:
    name: Trivy container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t npm-scan-demo:ci .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "npm-scan-demo:ci"
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-image"
